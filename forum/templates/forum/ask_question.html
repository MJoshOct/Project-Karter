{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ask a Question</title>
    <link rel="stylesheet" href="{% static 'forum/style.css' %}">
</head>
<body>
<header>
    <h1>Ask a Question</h1>
    <a href="{% url 'homepage' %}" class="btn">🏠 Home</a>
    <a href="{% url 'forum:question_list' %}" class="btn">📋 View Questions</a>
</header>

<div class="container">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Post Question</button>
    </form>
</div>
</body>
</html>

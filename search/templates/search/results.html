{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
    <link rel="stylesheet" href="{% static 'search/results.css' %}">
</head>
<body>
    <header>
        <h1>Search Results for "{{ query }}"</h1>
        <nav>
            <a href="{% url 'homepage' %}">🏠 Home</a>
            <a href="{% url 'forum:question_list' %}">💬 Forum</a>
        </nav>
    </header>

    <main class="container">
        {% if results %}
            <ul>
                {% for item in results %}
                    <li>
                        <a href="{% url 'forum:question_detail' item.slug %}">
                            {{ item.title }}
                        </a>
                        <p>{{ item.body|truncatewords:20 }}</p>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No results found.</p>
        {% endif %}
    </main>
</body>
</html>

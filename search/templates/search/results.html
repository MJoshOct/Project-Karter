{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
    <link rel="stylesheet" href="{% static 'search/result.css' %}">
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="logo">
            <a href="{% url 'homepage' %}">Karter</a>
        </div>
        <nav class="nav-links">
            <a href="{% url 'homepage' %}"> Home</a>
            <a href="{% url 'forum:question_list' %}"> Forum</a>
        </nav>
    </header>

    <!-- Main container -->
    <main class="container">
        <h1>Search Results for "<span class="query">{{ query }}</span>"</h1>

        {% if results %}
            <ul class="results-list">
                {% for item in results %}
                    <li class="result-item">
                        <a href="{% url 'forum:question_detail' item.slug %}" class="result-title">
                            {{ item.title }}
                        </a>
                        <p class="result-snippet">{{ item.body|truncatewords:25 }}</p>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <div class="no-results">
                <p> No results found for "<strong>{{ query }}</strong>".</p>
                <a href="{% url 'homepage' %}" class="btn">Go Back Home</a>
            </div>
        {% endif %}
    </main>
</body>
</html>
